version: 2

models:
  - name: int_311__requests_enriched
    description: Typed requests plus closure timing and the flags that decide what counts toward KPIs.
    columns:
      - name: sr_number
        data_tests: [unique, not_null]
      - name: hours_to_close
        data_tests: [not_negative]

  - name: int_311__service_work
    description: >
      Requests that performance metrics are about: counted (not duplicates) and not of a request type the city
      closes on receipt. Every KPI mart reads from this view.
    columns:
      - name: sr_number
        data_tests: [unique, not_null]

unit_tests:
  - name: int_closure_logic
    description: >
      Canceled requests without a closed date leave the backlog when last modified; a closure recorded before
      creation is flagged and excluded from durations; open requests have no duration.
    model: int_311__requests_enriched
    given:
      - input: ref('stg_311__service_requests')
        rows:
          - {sr_number: "A", status: "Completed", created_at: "2024-01-01 00:00:00", closed_at_source: "2024-01-03 12:00:00", last_modified_at: "2024-01-03 12:00:00", is_duplicate: false}
          - {sr_number: "B", status: "Canceled", created_at: "2024-01-01 00:00:00", closed_at_source: null, last_modified_at: "2024-01-01 06:00:00", is_duplicate: false}
          - {sr_number: "C", status: "Completed", created_at: "2024-01-05 00:00:00", closed_at_source: "2024-01-04 00:00:00", last_modified_at: "2024-01-05 00:00:00", is_duplicate: false}
          - {sr_number: "D", status: "Open", created_at: "2024-01-05 00:00:00", closed_at_source: null, last_modified_at: "2024-01-05 00:00:00", is_duplicate: true}
    expect:
      rows:
        - {sr_number: "A", hours_to_close: 60.0, is_open: false, is_canceled: false, has_closure_before_creation: false, is_counted: true}
        - {sr_number: "B", hours_to_close: 6.0, is_open: false, is_canceled: true, has_closure_before_creation: false, is_counted: true}
        - {sr_number: "C", hours_to_close: null, is_open: false, is_canceled: false, has_closure_before_creation: true, is_counted: true}
        - {sr_number: "D", hours_to_close: null, is_open: true, is_canceled: false, has_closure_before_creation: false, is_counted: false}
