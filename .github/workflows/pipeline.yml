name: Daily pipeline

# Loads new and changed 311 requests, rebuilds and tests the warehouse with dbt, and republishes the site.
on:
  schedule:
    - cron: "23 11 * * *" # every day at 11:23 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Rebuild incremental models from scratch"
        type: boolean
        default: false

permissions:
  contents: write # save the warehouse as a release asset and commit README results
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test before touching real data
        run: pytest -q

      # The DuckDB warehouse (raw log, models, snapshot history) is kept between runs as a release asset.
      - name: Restore the warehouse from the last run
        run: |
          mkdir -p warehouse
          if gh release download warehouse --pattern "chicago311.duckdb.zst" --dir warehouse; then
            zstd -d --rm warehouse/chicago311.duckdb.zst -o warehouse/chicago311.duckdb
            ls -lh warehouse
          else
            echo "No saved warehouse yet: this run backfills everything since 2023 (takes longer)."
          fi

      - name: Extract, load, transform, test, document, build site
        run: python -m c311.pipeline ${{ inputs.full_refresh && '--full-refresh' || '' }}
        env:
          PYTHONPATH: src

      - name: Save the warehouse for the next run
        run: |
          zstd -T0 -10 -f warehouse/chicago311.duckdb -o chicago311.duckdb.zst
          gh release view warehouse > /dev/null 2>&1 || gh release create warehouse --latest=false \
            --title "Warehouse snapshot (updated daily)" \
            --notes "DuckDB file with the raw 311 log, every dbt model and the snapshot history. Download, run 'zstd -d chicago311.duckdb.zst', then open it with DuckDB."
          gh release upload warehouse chicago311.duckdb.zst --clobber

      - name: Commit README results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "Daily results: data through $(python -c 'import json;print(json.load(open("site/results.json"))["data_as_of"][:10])')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
